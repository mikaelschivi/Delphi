server {
    listen 80;

    location /api/ {
        proxy_pass http://delphi_backend:8000;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://delphi_backend:8000;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
